services:
  db:
    image: postgres:16
    container_name: controle-gastos-db
    restart: always
    environment:
      POSTGRES_DB: controle_gastos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - controle_gastos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d controle_gastos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: controle-gastos-api
    restart: always
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=controle_gastos;Username=postgres;Password=postgres
    ports:
      - "5044:8080"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: controle-gastos-web
    restart: always
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  controle_gastos_data: